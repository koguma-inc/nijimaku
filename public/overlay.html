<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nijimaku overlay</title>
    <!-- bodyに背景を付けない（OBSの既定CSSで透過になる） -->
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div id="overlay"></div>
    <script type="module">
      import { createVersionWatch, mountOverlay } from "./overlay.js";
      // 更新でサーバーの版が変わったら、新しい版のoverlay.js・overlay.cssを読み直す
      const isNewVersion = createVersionWatch();
      mountOverlay(document.getElementById("overlay"), {
        // ?mode=karaoke は設定に関係なく常に1行で流す表示（歌う場面のブラウザソース用）。無ければ設定に従う
        mode: new URLSearchParams(location.search).get("mode"),
        onVersion: (version) => {
          if (isNewVersion(version)) location.reload();
        },
      });
    </script>
  </body>
</html>
